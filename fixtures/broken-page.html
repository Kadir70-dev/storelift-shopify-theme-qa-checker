<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Intentionally broken: missing title, description, H1, bad images, placeholder text, broken links -->
<link rel="canonical" href="https://testshop.myshopify.com/pages/broken-test">
<meta name="robots" content="noindex">
<script>window.Shopify = { shop: 'testshop.myshopify.com' };</script>
</head>
<body>
<!-- No H1 heading -->
<p>Lorem ipsum dolor sit amet consectetur adipiscing.</p>
<!-- Image with no alt, broken src -->
<img src="https://testshop.myshopify.com/broken-404.jpg" alt="" id="broken-img" width="100" height="100">
<!-- Image without alt attribute at all -->
<img src="https://testshop.myshopify.com/no-alt.jpg" width="100" height="100">
<!-- Hidden analytics beacon (like Bing UET #batBeacon): its failed load must not count as a broken storefront image. -->
<img id="batBeacon123" src="https://testshop.myshopify.com/beacon-404.gif" alt="" width="0" height="0" style="display:none">
<!-- Empty anchor -->
<a href="">Click here</a>
<!-- Hash anchor that's not a button -->
<a href="#">Go somewhere</a>
<!-- javascript: anchor -->
<a href="javascript:doSomething()">JS link</a>
</body>
</html>
